# LORE configuration — see lore/config.py for all keys and defaults.
#
# This checkout is set up for ONE reader on ONE computer, with every model on
# OpenRouter (https://openrouter.ai): text through minimax/minimax-m3.1-flash,
# embeddings through qwen/qwen3-embedding-8b at 768 dimensions. No Ollama, no
# Gemini, no llama.cpp, no Claude/OpenAI account.
#
# The key is never here: put one line
#   OPENROUTER_API_KEY=sk-or-...
# in ~/.config/lore/openrouter.env (mode 600), or set the environment
# variable. One key serves both the text models and the embeddings.
[lore]
data_dir = "data"
# "gemini" is LORE's name for "the remote model [lore.llm] picks": running a
# chunk through it means through OpenRouter here (not Google's API).
# Embeddings are chosen separately, in [lore.embedding] below.
extraction_provider = "gemini"

[lore.llm]
provider = "openrouter"
# The model every step runs on: extraction, the graph build, disambiguation,
# story beats, character profiles, and answers.
model = "minimax/minimax-m3.1-flash"
# Tried in order when one is rate limited (429), overloaded (503) or not
# available to the key (404). Swap or extend freely: any OpenRouter model id
# works (openrouter.ai/models).
models = ["minimax/minimax-m3.1-flash", "google/gemini-3.1-flash-lite"]
# Short structured steps (search selection, question splitting, the claim
# check) may run on the cheaper model: the same family here, so left unset.
# fast_model = "google/gemini-3.1-flash-lite"
# Requests in flight at once while processing a book. One at a time would make
# a novel take hours; a paid OpenRouter key is not metered per minute by LORE.
concurrency = 4
# Cap per reply (0 sends none and lets the model decide).
max_output_tokens = 8192

[lore.embedding]
provider = "openrouter"
model = "qwen/qwen3-embedding-8b"
# The stores are declared 768 wide (lore/db/lance_store.py); OpenRouter is
# asked to shorten the model's vectors to that width. Change both together,
# and re-process every book: a library's vectors must all come from ONE model.
dimensions = 768

[lore.ollama]
# Unused with the settings above (kept so a switch back needs no edit).
host = "http://localhost:11434"
model = "qwen2.5:3b-instruct-q4_K_M"

[lore.extraction]
work_unit_size = 10

# The two `lore ask` LLM steps. "gemini" means "the remote model [lore.llm]
# picks", which is OpenRouter here.
[lore.selection]
provider = "gemini"

[lore.synthesis]
provider = "gemini"

# The resolver's borderline merge questions during `lore process`.
[lore.adjudication]
provider = "gemini"

# Record ambiguous bare surnames during `lore process`; `lore disambiguate`
# answers them in one request per batch.
[lore.disambiguation]
enabled = true

[lore.processing]
# OpenRouter has no free-tier daily request cap, so the Gemini answer reserve
# does not apply; it is harmless left at its default.
answer_reserve = 60
llm_concurrency = 4
